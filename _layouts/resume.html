---
layout: default
panel_includes:
  - toc
---

{% include lang.html %}
{% include toc-status.html %}

<article class="px-1" data-toc="{{ enable_toc }}">
  {% assign tab_key = page.title | downcase %}
  {% assign title = site.data.locales[lang].tabs[tab_key] | default: page.title %}
  <h1 class="dynamic-title" data-toc-skip>{{ title }}</h1>
  <div class="content">
    {{ content }}
  </div>
</article>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var article = document.querySelector('main > article[data-toc="true"]');
    var toc = document.getElementById('toc');
    var tocWrapper = document.getElementById('toc-wrapper');

    if (!article || !toc || !tocWrapper || !window.tocbot) {
      return;
    }

    window.tocbot.init({
      tocSelector: '#toc',
      contentSelector: 'main > article .content',
      headingSelector: 'h2, h3',
      collapseDepth: 6,
      headingsOffset: 96,
      scrollSmoothOffset: -96
    });

    tocWrapper.classList.remove('invisible');
  });
</script>
