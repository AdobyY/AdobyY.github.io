---
layout: default
hide_access_panel: true
panel_includes:
  - resume-toc
---

{% include lang.html %}

<article class="px-1">
  {% assign tab_key = page.title | downcase %}
  {% assign title = site.data.locales[lang].tabs[tab_key] | default: page.title %}
  <h1 class="dynamic-title" data-toc-skip>{{ title }}</h1>
  <div class="content">
    {{ content }}
  </div>
</article>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var nav = document.getElementById('resume-toc');
    var headings = Array.from(document.querySelectorAll('main > article .content > h2'));
    var links = [];

    if (!nav || !headings.length) {
      return;
    }

    headings.forEach(function (heading, index) {
      if (!heading.id) {
        heading.id = 'resume-section-' + index;
      }

      var link = document.createElement('a');
      link.className = 'resume-toc-link';
      link.href = '#' + heading.id;
      link.textContent = heading.textContent;
      nav.appendChild(link);
      links.push({ heading: heading, link: link });
    });

    function setActive(activeHeading) {
      links.forEach(function (item) {
        var active = item.heading === activeHeading;
        item.link.toggleAttribute('aria-current', active);
      });
    }

    function updateActiveLink() {
      var activeHeading = headings[0];

      headings.forEach(function (heading) {
        if (heading.getBoundingClientRect().top <= 150) {
          activeHeading = heading;
        }
      });

      setActive(activeHeading);
    }

    document.addEventListener('scroll', updateActiveLink, { passive: true });
    window.addEventListener('resize', updateActiveLink);
    updateActiveLink();
  });
</script>

<style>
  .resume-hero {
    margin-bottom: 0.65rem;
  }

  .resume-role {
    color: var(--text-color);
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 0.2rem;
  }

  .resume-role span,
  .resume-contact span {
    color: var(--text-muted-color);
    padding: 0 0.3rem;
  }

  .resume-focus {
    color: var(--text-muted-color);
    font-size: 1rem;
    margin-bottom: 0;
  }

  .resume-contact {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin: 1.1rem 0 1.5rem;
  }

  .resume-contact i {
    color: var(--link-color);
  }

  .resume-contact span {
    padding: 0 0.15rem;
  }

  .resume-metrics {
    display: grid;
    gap: 0.75rem;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    margin: 0 0 2.5rem;
  }

  .resume-metric {
    align-items: center;
    background: color-mix(in srgb, var(--card-bg) 82%, var(--main-bg));
    border: 1px solid var(--btn-border-color);
    border-radius: 0.65rem;
    display: grid;
    gap: 0.15rem 0.6rem;
    grid-template-columns: auto 1fr;
    padding: 0.85rem;
  }

  .resume-metric i {
    color: var(--link-color);
    grid-row: span 2;
  }

  .resume-metric strong {
    color: var(--text-color);
    font-size: 1.1rem;
    line-height: 1;
  }

  .resume-metric span {
    color: var(--text-muted-color);
    font-size: 0.78rem;
    line-height: 1.2;
  }

  main > article .content > h2 {
    margin-top: 3.3rem;
  }

  .resume-section-icon {
    color: var(--link-color);
    font-size: 0.9em;
    margin-right: 0.25rem;
    width: 1.25em;
  }

  .tech-groups {
    display: grid;
    gap: 1rem;
    margin: 1.25rem 0 1.5rem;
  }

  .tech-group {
    background: color-mix(in srgb, var(--card-bg) 72%, var(--main-bg));
    border: 1px solid var(--btn-border-color);
    border-radius: 0.7rem;
    padding: 0.9rem;
  }

  .tech-group-label {
    color: var(--text-color);
    font-size: 0.95rem;
    font-weight: 700;
    margin: 0 0 0.75rem;
  }

  .tech-group-label i {
    color: var(--link-color);
    margin-right: 0.4rem;
    width: 1.1rem;
  }

  .tech-chip-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
  }

  .tech-chip {
    align-items: center;
    background: color-mix(in srgb, var(--main-bg) 70%, transparent);
    border: 1px solid color-mix(in srgb, var(--btn-border-color) 75%, transparent);
    border-radius: 999px;
    color: var(--text-color);
    display: inline-flex;
    font-size: 0.82rem;
    gap: 0.38rem;
    line-height: 1.2;
    padding: 0.36rem 0.6rem;
  }

  .tech-chip img,
  .tech-chip i {
    color: var(--link-color);
    flex: 0 0 auto;
    height: 0.95rem;
    text-align: center;
    width: 0.95rem;
  }

  .tech-chip i {
    align-items: center;
    display: inline-flex;
    justify-content: center;
  }

  @media (max-width: 640px) {
    .resume-metrics {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .resume-metric:last-child {
      grid-column: span 2;
    }
  }
</style>
